<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applications of Biot–Savart's Law — Grade XII Physics</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="viewport">
<main id="stage">

  <!-- ============ SLIDE 1 · COVER ============ -->
  <section class="slide cover" id="s1">
    <canvas id="cv1"></canvas>
    <div class="cover-text">
      <div class="cover-school" data-fill="s1.school"></div>
      <h1 class="cover-title"><span data-fill="s1.t1"></span><br><span class="cover-title-accent" data-fill="s1.t2"></span></h1>
      <div class="cover-sub" data-fill="s1.sub"></div>
      <div class="cover-chain">
        <span class="cc-pill cc-blue" data-fill="chain.current"></span><span class="cc-arrow">→</span>
        <span class="cc-pill cc-orange" data-fill="chain.field"></span><span class="cc-arrow">→</span>
        <span class="cc-pill cc-green" data-fill="chain.force"></span>
      </div>
      <div class="cover-present">
        <div class="cover-present-name" data-fill="s1.presenter"></div>
        <div class="cover-present-grade" data-fill="s1.grade"></div>
      </div>
    </div>
  </section>

  <!-- ============ SLIDE 2 · ØRSTED ============ -->
  <section class="slide" id="s2" data-chain="current,field">
    <header class="s-head"><h2 class="s-title" data-fill="s2.title"></h2><div class="chain"></div></header>
    <div class="s-body grid-s2">
      <div class="col-left">
        <div class="card anim-in">
          <p class="body-line" data-fill="s2.i1"></p>
          <p class="body-line" data-fill="s2.i2"></p>
          <p class="body-line" data-fill="s2.i3"></p>
        </div>
        <div class="card controls-card anim-in">
          <button class="toggle" id="tg2" role="switch" aria-checked="false"><span class="knob"></span><span class="tg-txt"></span></button>
          <div class="ctl-row">
            <button class="btn btn-secondary" id="rev2" data-fill="s2.reverse"></button>
            <button class="btn btn-ghost" id="reset2" data-fill="btn.reset"></button>
          </div>
          <div class="caption-chip" id="cap2"></div>
        </div>
        <div class="statement-box anim-in"><span class="statement-tag" data-fill="s2.stTag"></span><span data-fill="s2.statement"></span></div>
      </div>
      <div class="col-right canvas-wrap anim-in"><canvas id="cv2"></canvas></div>
    </div>
  </section>

  <!-- ============ SLIDE 3 · WHO AND WHEN ============ -->
  <section class="slide" id="s3" data-chain="current,field">
    <header class="s-head"><h2 class="s-title" data-fill="s3.title"></h2><div class="chain"></div></header>
    <div class="s-body">
      <div class="grid-s3">
        <div class="people-col">
          <div class="card person-card anim-in">
            <svg class="avatar" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="46" fill="#1565FF"/><circle cx="48" cy="36" r="15" fill="#FFFFFF" opacity=".9"/><path d="M20 82 Q48 56 76 82 Z" fill="#FFFFFF" opacity=".9"/><text x="48" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">JB</text></svg>
            <div><div class="person-name" data-fill="s3.p1"></div><div class="person-role" data-fill="s3.role"></div><span class="chip-amber chip-year" data-fill="s3.year"></span></div>
          </div>
          <div class="card person-card anim-in">
            <svg class="avatar" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="46" fill="#FF6A13"/><circle cx="48" cy="36" r="15" fill="#FFFFFF" opacity=".9"/><path d="M20 82 Q48 56 76 82 Z" fill="#FFFFFF" opacity=".9"/><text x="48" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">FS</text></svg>
            <div><div class="person-name" data-fill="s3.p2"></div><div class="person-role" data-fill="s3.role"></div><span class="chip-amber chip-year" data-fill="s3.year"></span></div>
          </div>
        </div>
        <div class="law-col">
          <div class="card anim-in"><p class="law-text" data-fill="s3.law"></p></div>
          <div class="formula-box anim-in">
            <div class="formula-main" data-fill="s3.formula"></div>
            <div class="formula-sub" data-fill="s3.mu0"></div>
          </div>
        </div>
        <div class="card diagram-card anim-in">
          <svg viewBox="0 0 460 420" class="bs-diagram" aria-label="Current element diagram">
            <defs><marker id="mBlue" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1565FF"/></marker><marker id="mNavy" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0B1F3A"/></marker></defs>
            <line x1="150" y1="390" x2="150" y2="120" stroke="#C8742B" stroke-width="8"/>
            <line x1="150" y1="330" x2="150" y2="212" stroke="#1565FF" stroke-width="7" marker-end="url(#mBlue)"/>
            <text x="92" y="270" font-size="30" font-weight="700" fill="#1565FF">I dl</text>
            <line x1="150" y1="270" x2="352" y2="126" stroke="#0B1F3A" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#mNavy)"/>
            <text x="268" y="222" font-size="30" font-weight="700" fill="#0B1F3A">r</text>
            <path d="M150 222 A48 48 0 0 1 189 242" fill="none" stroke="#FFC400" stroke-width="5"/>
            <text x="176" y="206" font-size="30" font-weight="700" fill="#B8860B">θ</text>
            <circle cx="360" cy="120" r="9" fill="#0B1F3A"/>
            <text x="376" y="112" font-size="30" font-weight="700" fill="#0B1F3A">P</text>
            <circle cx="360" cy="66" r="17" fill="none" stroke="#FF6A13" stroke-width="4"/><circle cx="360" cy="66" r="4.5" fill="#FF6A13"/>
            <text x="386" y="66" font-size="26" font-weight="700" fill="#FF6A13">dB (out)</text>
            <text x="150" y="412" font-size="26" fill="#38475F" text-anchor="middle">current element</text>
          </svg>
        </div>
      </div>
      <div class="strip">
        <div class="strip-head">
          <span class="strip-title" data-fill="s3.stripTitle"></span>
          <button class="btn btn-primary btn-play" id="play3" data-fill="s3.play"></button>
          <button class="btn btn-ghost" id="reset3" data-fill="btn.reset"></button>
        </div>
        <div class="steps-row">
          <div class="card step-card" id="step3-1"><span class="step-num">1</span><p data-fill="s3.st1"></p></div>
          <div class="card step-card" id="step3-2"><span class="step-num">2</span><p data-fill="s3.st2"></p></div>
          <div class="card step-card" id="step3-3"><span class="step-num">3</span><p data-fill="s3.st3"></p></div>
        </div>
        <div class="laplace-note" data-fill="s3.laplace"></div>
      </div>
    </div>
  </section>

  <!-- ============ SLIDE 4 · 3D ============ -->
  <section class="slide" id="s4" data-chain="current,field">
    <header class="s-head"><h2 class="s-title" data-fill="s4.title"></h2><div class="chain"></div></header>
    <div class="s-body grid-s4">
      <div class="col-left">
        <div class="canvas-wrap canvas-3d anim-in"><canvas id="cv4"></canvas><div class="drag-hint" data-fill="s4.drag"></div></div>
        <div class="step-btn-row">
          <button class="btn btn-secondary step-btn" id="step4-1" data-fill="s4.b1"></button>
          <button class="btn btn-secondary step-btn" id="step4-2" data-fill="s4.b2"></button>
          <button class="btn btn-secondary step-btn" id="step4-3" data-fill="s4.b3"></button>
        </div>
        <div class="rh-note" id="rh4" data-fill="s4.rh"></div>
      </div>
      <div class="card calc-panel anim-in">
        <div class="panel-title" data-fill="s4.calc"></div>
        <div class="slider-block">
          <div class="slider-label"><span data-fill="s4.slI"></span><span class="chip-amber chip-val" id="valI4"></span></div>
          <input type="range" id="slI4" min="1" max="20" step="1" value="10" aria-label="Current in amperes">
        </div>
        <div class="slider-block">
          <div class="slider-label"><span data-fill="s4.slR"></span><span class="chip-amber chip-val" id="valR4"></span></div>
          <input type="range" id="slR4" min="1" max="10" step="1" value="2" aria-label="Distance in centimetres">
        </div>
        <div class="chip-amber chip-result" id="chip4"></div>
        <div class="sub-line" id="sub4"></div>
        <div class="takeaway-list">
          <div class="takeaway"><span class="tk-ico tk-blue">∝</span><span data-fill="s4.take1"></span></div>
          <div class="takeaway"><span class="tk-ico tk-orange">∝</span><span data-fill="s4.take2"></span></div>
        </div>
        <div class="ctl-row">
          <button class="toggle toggle-small" id="tgAuto4" role="switch" aria-checked="true"><span class="knob"></span><span class="tg-txt"></span></button>
          <button class="btn btn-ghost" id="reset4" data-fill="btn.reset"></button>
        </div>
        <div class="auto-label" data-fill="s4.auto"></div>
      </div>
    </div>
  </section>

  <!-- ============ SLIDE 5 · EARTH ============ -->
  <section class="slide" id="s5" data-chain="field">
    <header class="s-head">
      <div class="title-with-badge"><span class="fun-badge" data-fill="s5.badge"></span><h2 class="s-title" data-fill="s5.title"></h2></div>
      <div class="chain"></div>
    </header>
    <div class="s-body grid-s5">
      <div class="canvas-wrap anim-in"><canvas id="cv5"></canvas></div>
      <div class="col-right">
        <div class="card anim-in">
          <p class="body-line" data-fill="s5.f1"></p>
          <p class="body-line" data-fill="s5.f2"></p>
        </div>
        <div class="card anim-in">
          <div class="panel-title" data-fill="s5.barsTitle"></div>
          <div class="bar-row"><span class="bar-label" data-fill="s5.earthLabel"></span><div class="bar-track"><div class="bar-fill bar-orange" id="barEarth"></div></div></div>
          <div class="bar-row"><span class="bar-label" data-fill="s5.wireLabel"></span><div class="bar-track"><div class="bar-fill bar-blue" id="barWire"></div></div></div>
          <div class="bars-note" data-fill="s5.barsNote"></div>
        </div>
        <div class="chip-amber chip-caption anim-in" data-fill="s5.caption"></div>
        <button class="btn btn-ghost" id="reset5" data-fill="btn.reset"></button>
      </div>
    </div>
  </section>

  <!-- ============ SLIDE 6 · THREE SHAPES ============ -->
  <section class="slide" id="s6" data-chain="current,field">
    <header class="s-head"><h2 class="s-title" data-fill="s6.title"></h2><div class="chain"></div></header>
    <div class="s-body">
      <div class="tabs-row">
        <button class="tab-btn active" id="tab6-w" data-fill="s6.tabW"></button>
        <button class="tab-btn" id="tab6-c" data-fill="s6.tabC"></button>
        <button class="tab-btn" id="tab6-s" data-fill="s6.tabS"></button>
        <button class="btn btn-ghost" id="reset6" data-fill="btn.reset"></button>
      </div>
      <div class="grid-s6">
        <div class="canvas-wrap anim-in"><canvas id="cv6"></canvas></div>
        <div class="card calc-panel">
          <div class="shape-pane" id="pan6-w">
            <div class="formula-inline" data-fill="s6.fW"></div>
            <div class="example-line" data-fill="s6.exW"></div>
            <div class="slider-block"><div class="slider-label"><span data-fill="s6.slI"></span><span class="chip-amber chip-val" id="valI6w"></span></div><input type="range" id="slI6w" min="1" max="20" step="1" value="10"></div>
            <div class="slider-block"><div class="slider-label"><span data-fill="s6.slR"></span><span class="chip-amber chip-val" id="valR6w"></span></div><input type="range" id="slR6w" min="1" max="10" step="1" value="2"></div>
            <div class="chip-amber chip-result" id="chip6w"></div>
          </div>
          <div class="shape-pane hidden" id="pan6-c">
            <div class="formula-inline" data-fill="s6.fC"></div>
            <div class="example-line" data-fill="s6.exC"></div>
            <div class="slider-block"><div class="slider-label"><span data-fill="s6.slN"></span><span class="chip-amber chip-val" id="valN6c"></span></div><input type="range" id="slN6c" min="1" max="200" step="1" value="100"></div>
            <div class="slider-block"><div class="slider-label"><span data-fill="s6.slI"></span><span class="chip-amber chip-val" id="valI6c"></span></div><input type="range" id="slI6c" min="0.5" max="5" step="0.5" value="2"></div>
            <div class="chip-amber chip-result" id="chip6c"></div>
            <div class="bars-note" data-fill="s6.rNote"></div>
          </div>
          <div class="shape-pane hidden" id="pan6-s">
            <div class="formula-inline" data-fill="s6.fS"></div>
            <div class="example-line" data-fill="s6.exS"></div>
            <div class="slider-block"><div class="slider-label"><span data-fill="s6.slNsm"></span><span class="chip-amber chip-val" id="valN6s"></span></div><input type="range" id="slN6s" min="100" max="2000" step="100" value="1000"></div>
            <div class="slider-block"><div class="slider-label"><span data-fill="s6.slI"></span><span class="chip-amber chip-val" id="valI6s"></span></div><input type="range" id="slI6s" min="0.5" max="5" step="0.5" value="2"></div>
            <div class="chip-amber chip-result" id="chip6s"></div>
            <div class="bars-note" data-fill="s6.sNote"></div>
          </div>
        </div>
      </div>
      <div class="takeaway-banner anim-in"><span class="tb-ico">★</span><span data-fill="s6.takeaway"></span></div>
    </div>
  </section>

  <!-- ============ SLIDE 7 · SOFT IRON CORE ============ -->
  <section class="slide" id="s7" data-chain="current,field">
    <header class="s-head"><h2 class="s-title" data-fill="s7.title"></h2><div class="chain"></div></header>
    <div class="s-body">
      <div class="grid-s7">
        <div class="col-left">
          <div class="canvas-wrap anim-in"><canvas id="cv7"></canvas></div>
          <div class="legend-row">
            <span class="legend-item"><svg viewBox="0 0 40 20" width="40" height="20"><line x1="6" y1="14" x2="30" y2="6" stroke="#5B6B7F" stroke-width="4"/><path d="M30 6 l-9 -1 l4 8 Z" fill="#5B6B7F"/></svg><span data-fill="s7.leg1"></span></span>
            <span class="legend-item"><svg viewBox="0 0 40 20" width="40" height="20"><line x1="6" y1="10" x2="30" y2="10" stroke="#FF6A13" stroke-width="4"/><path d="M34 10 l-9 -5 l0 10 Z" fill="#FF6A13"/></svg><span data-fill="s7.leg2"></span></span>
          </div>
        </div>
        <div class="col-right">
          <div class="card controls-card anim-in">
            <button class="toggle" id="tg7" role="switch" aria-checked="false"><span class="knob"></span><span class="tg-txt"></span></button>
            <div class="seg" id="mat7">
              <button class="seg-btn" data-mat="air" data-fill="s7.mAir"></button>
              <button class="seg-btn active" data-mat="iron" data-fill="s7.mIron"></button>
              <button class="seg-btn" data-mat="steel" data-fill="s7.mSteel"></button>
            </div>
            <button class="btn btn-ghost" id="reset7" data-fill="btn.reset"></button>
          </div>
          <div class="card meter-card anim-in">
            <div class="panel-title" data-fill="s7.meterTitle"></div>
            <div class="meter-track"><div class="meter-fill" id="meter7"></div></div>
            <div class="meter-txt" id="meterTxt7"></div>
          </div>
        </div>
      </div>
      <div class="takeaway-duo">
        <div class="card takeaway-card anim-in"><span class="tk-bullet tk-orange-bg">1</span><span data-fill="s7.take1"></span></div>
        <div class="card takeaway-card anim-in"><span class="tk-bullet tk-green-bg">2</span><span data-fill="s7.take2"></span></div>
      </div>
    </div>
  </section>

  <!-- ============ SLIDE 8 · CRANE ============ -->
  <section class="slide" id="s8" data-chain="current,field,force">
    <header class="s-head"><h2 class="s-title" data-fill="s8.title"></h2><div class="chain"></div></header>
    <div class="s-body grid-s8">
      <div class="canvas-wrap anim-in"><canvas id="cv8"></canvas></div>
      <div class="col-right">
        <div class="card steps-card anim-in">
          <ol class="crane-steps" id="steps8">
            <li><span class="cs-num">1</span><span data-fill="s8.st1"></span></li>
            <li><span class="cs-num">2</span><span data-fill="s8.st2"></span></li>
            <li><span class="cs-num">3</span><span data-fill="s8.st3"></span></li>
            <li><span class="cs-num">4</span><span data-fill="s8.st4"></span></li>
          </ol>
          <div class="release-line" data-fill="s8.release"></div>
        </div>
        <div class="card anim-in">
          <div class="formula-inline" data-fill="s8.formula"></div>
          <div class="honest-note" data-fill="s8.note"></div>
        </div>
        <div class="card controls-card anim-in">
          <button class="toggle" id="tg8" role="switch" aria-checked="false"><span class="knob"></span><span class="tg-txt"></span></button>
          <div class="ctl-row">
            <button class="btn btn-primary" id="lift8"></button>
            <button class="btn btn-ghost" id="reset8" data-fill="btn.reset"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ SLIDE 9 · LOUDSPEAKER ============ -->
  <section class="slide" id="s9" data-chain="current,field,force">
    <header class="s-head"><h2 class="s-title" data-fill="s9.title"></h2><div class="chain"></div></header>
    <div class="s-body grid-s9">
      <div class="canvas-wrap anim-in"><canvas id="cv9"></canvas></div>
      <div class="col-right">
        <div class="card anim-in">
          <div class="slider-block"><div class="slider-label"><span data-fill="s9.freq"></span><span class="chip-amber chip-val" id="valF9"></span></div><input type="range" id="slF9" min="0.2" max="2" step="0.1" value="0.6"><div class="slider-note" data-fill="s9.freqNote"></div></div>
          <div class="slider-block"><div class="slider-label"><span data-fill="s9.amp"></span><span class="chip-amber chip-val" id="valA9"></span></div><input type="range" id="slA9" min="10" max="60" step="1" value="35"><div class="slider-note" data-fill="s9.ampNote"></div></div>
        </div>
        <div class="card anim-in">
          <div class="formula-inline" data-fill="s9.force"></div>
          <div class="example-line" data-fill="s9.nums"></div>
          <div class="honest-note" data-fill="s9.revNote"></div>
        </div>
        <div class="card controls-card anim-in">
          <button class="btn btn-secondary btn-tone" id="tone9"></button>
          <button class="btn btn-ghost" id="reset9" data-fill="btn.reset"></button>
        </div>
        <div class="chain-line anim-in" data-fill="s9.chain"></div>
      </div>
    </div>
  </section>

  <!-- ============ SLIDE 10 · FOUR APPLICATIONS ============ -->
  <section class="slide" id="s10" data-chain="current,field,force">
    <header class="s-head"><h2 class="s-title" data-fill="s10.title"></h2><div class="chain"></div></header>
    <div class="s-body">
      <div class="apps-grid">
        <div class="card app-card anim-in">
          <canvas id="cv10a"></canvas>
          <div class="app-text"><div class="app-name" data-fill="s10.a1n"></div><p class="app-cap" data-fill="s10.a1c"></p><button class="btn btn-secondary btn-run" id="run10a" data-fill="s10.run"></button></div>
        </div>
        <div class="card app-card anim-in">
          <canvas id="cv10b"></canvas>
          <div class="app-text"><div class="app-name" data-fill="s10.a2n"></div><p class="app-cap" data-fill="s10.a2c"></p><button class="btn btn-secondary btn-run" id="run10b" data-fill="s10.run"></button></div>
        </div>
        <div class="card app-card anim-in">
          <canvas id="cv10c"></canvas>
          <div class="app-text"><div class="app-name" data-fill="s10.a3n"></div><p class="app-cap" data-fill="s10.a3c"></p><button class="btn btn-secondary btn-run" id="run10c" data-fill="s10.run"></button></div>
        </div>
        <div class="card app-card anim-in">
          <canvas id="cv10d"></canvas>
          <div class="app-text"><div class="app-name" data-fill="s10.a4n"></div><p class="app-cap" data-fill="s10.a4c"></p><button class="btn btn-secondary btn-run" id="run10d" data-fill="s10.run"></button></div>
        </div>
      </div>
      <div class="apps-banner anim-in">
        <span data-fill="s10.banner0"></span>
        <span class="bn-blue" data-fill="chain.current"></span><span class="bn-arrow">→</span>
        <span class="bn-orange" data-fill="s10.bannerField"></span><span class="bn-arrow">→</span>
        <span class="bn-green" data-fill="s10.bannerForce"></span>
        <button class="btn btn-ghost btn-banner-reset" id="reset10" data-fill="btn.reset"></button>
      </div>
    </div>
  </section>

  <!-- ============ SLIDE 11 · CLOSING ============ -->
  <section class="slide" id="s11" data-chain="current,field,force">
    <header class="s-head"><h2 class="s-title" data-fill="s11.title"></h2><div class="chain"></div></header>
    <div class="s-body closing-body">
      <div class="flow-row">
        <div class="flow-pill flow-blue"><span class="flow-ico">⚡</span><span data-fill="chain.current"></span></div>
        <div class="flow-arrow">→</div>
        <div class="flow-pill flow-orange"><span class="flow-ico">◎</span><span data-fill="s11.magField"></span></div>
        <div class="flow-arrow">→</div>
        <div class="flow-col">
          <div class="flow-pill flow-green"><span class="flow-ico">➜</span><span data-fill="chain.force"></span></div>
          <div class="machine-icons">
            <span class="machine"><svg viewBox="0 0 90 64" width="72" height="52" aria-hidden="true"><rect x="8" y="6" width="10" height="52" fill="#5B6B7F"/><rect x="8" y="6" width="62" height="8" fill="#5B6B7F"/><line x1="62" y1="14" x2="62" y2="30" stroke="#0B1F3A" stroke-width="3"/><rect x="48" y="30" width="28" height="12" rx="4" fill="#C8742B"/><rect x="52" y="44" width="9" height="8" fill="#5B6B7F"/><rect x="63" y="44" width="9" height="8" fill="#5B6B7F"/></svg><span data-fill="s11.crane"></span></span>
